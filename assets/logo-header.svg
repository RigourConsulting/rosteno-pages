<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160">
  <g transform="translate(15, 14) scale(0.66)">
    <!-- Stacked rounded blocks on left stem: x=34 to 64 -->
    <rect x="34" y="30" width="30" height="40" rx="10" fill="#40D7E6"/>
    <rect x="34" y="76" width="30" height="42" rx="10" fill="#C9E84A"/>
    <rect x="34" y="124" width="30" height="46" rx="10" fill="#40D7E6"/>

    <!-- Upper Bowl: starts flush at x=62 to seamlessly meet stem -->
    <path d="M 62 30 L 118 30 C 148 30 168 50 168 74 C 168 98 148 118 118 118 L 62 118 Z" fill="#40D7E6"/>

    <!-- Clock dial cutout -->
    <circle cx="114" cy="74" r="26" fill="#071B3A"/>
    <circle cx="114" cy="74" r="22" fill="none" stroke="#40D7E6" stroke-width="2" stroke-opacity="0.85"/>
    <circle cx="114" cy="56" r="2" fill="#F7F9FC"/>
    <circle cx="132" cy="74" r="2" fill="#F7F9FC"/>
    <circle cx="114" cy="92" r="2" fill="#F7F9FC"/>
    <circle cx="96" cy="74" r="2" fill="#F7F9FC"/>

    <!-- Clock hands at 10:10 -->
    <line x1="114" y1="74" x2="102" y2="62" stroke="#F7F9FC" stroke-width="3" stroke-linecap="round"/>
    <line x1="114" y1="74" x2="128" y2="61" stroke="#C9E84A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="114" cy="74" r="3.2" fill="#C9E84A"/>

    <!-- Dynamic Leg of R -->
    <path d="M 98 118 C 104 118 110 120 114 125 L 148 162 C 153 167 161 167 166 162 C 171 157 171 149 166 144 L 132 106 C 128 102 124 100 118 100 L 98 118 Z" fill="#C9E84A"/>
  </g>
  <text x="160" y="88" font-family="'SF Pro Rounded', 'Comfortaa', 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#F7F9FC" letter-spacing="3">ROSTENO</text>
  <text x="163" y="122" font-family="'SF Pro Display', 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#40D7E6" letter-spacing="1.5">Shift, Hours &amp; Pay</text>
</svg>